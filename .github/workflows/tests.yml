name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Unit, component and integration tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage threshold
        continue-on-error: true
        shell: pwsh
        run: |
          npm run test:ci *> test-output.log
          $exitCode = $LASTEXITCODE
          Set-Content -Path test-exit-code.txt -Value $exitCode
          exit 0

      - name: Print test output
        if: always()
        shell: pwsh
        run: Get-Content test-output.log

      - name: Verify test result
        shell: pwsh
        run: |
          $testExitCode = [int](Get-Content test-exit-code.txt)
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage/
            test-output.log
            test-exit-code.txt
          if-no-files-found: error