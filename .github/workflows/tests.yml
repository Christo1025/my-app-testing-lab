name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Unit, component and integration tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage threshold
        shell: cmd
        run: |
          npm run test:ci > test-output.log 2>&1
          echo %ERRORLEVEL%> test-exit-code.txt
          exit /b 0

      - name: Print test output
        if: always()
        shell: cmd
        run: type test-output.log

      - name: Verify test result
        shell: cmd
        run: |
          set /p TEST_EXIT_CODE=<test-exit-code.txt
          if not "%TEST_EXIT_CODE%"=="0" exit /b %TEST_EXIT_CODE%

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage/
            test-output.log
            test-exit-code.txt
          if-no-files-found: error