name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Unit, component and integration tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage threshold
        continue-on-error: true
        shell: pwsh
        run: |
          npm run test:ci *> test-output.log
          $exitCode = $LASTEXITCODE
          Set-Content -Path test-exit-code.txt -Value $exitCode
          exit 0

      - name: Print test output
        if: always()
        shell: pwsh
        run: Get-Content test-output.log

      - name: Verify test result
        shell: pwsh
        run: |
          if (-not (Test-Path jest-results.json)) { exit 1 }
          $results = Get-Content jest-results.json -Raw | ConvertFrom-Json
          if ($results.numFailedTestSuites -ne 0) { exit 1 }
          if ($results.numFailedTests -ne 0) { exit 1 }

          $coverage = Get-Content coverage/coverage-summary.json -Raw | ConvertFrom-Json
          $threshold = 70
          $metrics = @{
            statements = [double]$coverage.total.statements.pct
            branches = [double]$coverage.total.branches.pct
            functions = [double]$coverage.total.functions.pct
            lines = [double]$coverage.total.lines.pct
          }

          foreach ($metric in $metrics.GetEnumerator()) {
            if ($metric.Value -lt $threshold) {
              Write-Error "$($metric.Key) coverage $($metric.Value)% is below $threshold%"
              exit 1
            }
          }

          Write-Output "All tests passed and coverage is above $threshold%."

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage/
            test-output.log
            test-exit-code.txt
            jest-results.json
          if-no-files-found: error